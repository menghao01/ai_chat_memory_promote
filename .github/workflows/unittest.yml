name: unittest

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
      - "feat/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run unit tests
        run: >
          python -m unittest discover
          -s "${{ github.workspace }}/tests"
          -t "${{ github.workspace }}"
          -p "test_*.py"
          -v
